<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" role="img" aria-label="Schema einer Blüte mit nummerierten Teilen">
  <!-- Original Mathsachs educational flower schema (imageLabelSlots). -->
  <rect width="400" height="320" fill="#f4f8f0"/>
  <rect x="192" y="255" width="16" height="55" fill="#5a8f3a" rx="4"/>
  <ellipse cx="200" cy="250" rx="30" ry="14" fill="#6b8f3a"/>
  <!-- 1 Kelchblatt -->
  <path d="M155 245 Q130 215 148 185 Q170 210 180 240 Z" fill="#3f6f28"/>
  <path d="M245 245 Q270 215 252 185 Q230 210 220 240 Z" fill="#4a7a2e"/>
  <!-- 2 Kronblätter -->
  <ellipse cx="105" cy="155" rx="50" ry="34" fill="#e89aba" transform="rotate(-28 105 155)"/>
  <ellipse cx="295" cy="155" rx="50" ry="34" fill="#e89aba" transform="rotate(28 295 155)"/>
  <ellipse cx="200" cy="105" rx="44" ry="38" fill="#f0b0cc"/>
  <ellipse cx="150" cy="205" rx="42" ry="30" fill="#e090b0" transform="rotate(-12 150 205)"/>
  <ellipse cx="250" cy="205" rx="42" ry="30" fill="#e090b0" transform="rotate(12 250 205)"/>
  <!-- 3 Staubblätter -->
  <line x1="175" y1="195" x2="150" y2="125" stroke="#c9a227" stroke-width="3.5"/>
  <ellipse cx="150" cy="118" rx="11" ry="15" fill="#d4a017"/>
  <line x1="225" y1="195" x2="250" y2="125" stroke="#c9a227" stroke-width="3.5"/>
  <ellipse cx="250" cy="118" rx="11" ry="15" fill="#d4a017"/>
  <!-- Stempel: 6 Fruchtknoten, 5 Griffel, 4 Narbe -->
  <ellipse cx="200" cy="215" rx="20" ry="24" fill="#8fbc5a"/>
  <rect x="194" y="160" width="12" height="55" fill="#7aa84a" rx="3"/>
  <ellipse cx="200" cy="152" rx="17" ry="11" fill="#5f9335"/>
  <!-- Nummern auf den Strukturen (Drop-Zentren) -->
  <g font-family="system-ui,sans-serif" font-size="13" font-weight="700">
    <circle cx="145" cy="215" r="11" fill="#fff" stroke="#222" stroke-width="1.5"/>
    <text x="145" y="219" text-anchor="middle" fill="#111">1</text>
    <circle cx="70" cy="150" r="11" fill="#fff" stroke="#222" stroke-width="1.5"/>
    <text x="70" y="154" text-anchor="middle" fill="#111">2</text>
    <circle cx="150" cy="118" r="11" fill="#fff" stroke="#222" stroke-width="1.5"/>
    <text x="150" y="122" text-anchor="middle" fill="#111">3</text>
    <circle cx="200" cy="152" r="11" fill="#fff" stroke="#222" stroke-width="1.5"/>
    <text x="200" y="156" text-anchor="middle" fill="#111">4</text>
    <circle cx="200" cy="182" r="11" fill="#fff" stroke="#222" stroke-width="1.5"/>
    <text x="200" y="186" text-anchor="middle" fill="#111">5</text>
    <circle cx="200" cy="218" r="11" fill="#fff" stroke="#222" stroke-width="1.5"/>
    <text x="200" y="222" text-anchor="middle" fill="#111">6</text>
  </g>
</svg>
