<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" role="img" aria-label="Schema männliche Geschlechtsorgane unbeschriftet">
  <!-- Original educational schematic for Mathsachs / TaskTrophy (CC0 dedication by project). -->
  <rect width="400" height="320" fill="#faf8f5"/>
  <!-- bladder hint -->
  <ellipse cx="200" cy="70" rx="48" ry="32" fill="#d9e6f2" stroke="#5a6f84" stroke-width="1.5" stroke-dasharray="4 3"/>
  <!-- prostate -->
  <ellipse cx="200" cy="130" rx="36" ry="22" fill="#e8c4b8" stroke="#8a4a45" stroke-width="2"/>
  <!-- vas deferens left/right -->
  <path d="M120 200 C140 160 160 140 175 130" fill="none" stroke="#8a4a45" stroke-width="3"/>
  <path d="M280 200 C260 160 240 140 225 130" fill="none" stroke="#8a4a45" stroke-width="3"/>
  <!-- urethra through penis -->
  <rect x="188" y="145" width="24" height="110" rx="10" fill="#e8b0ab" stroke="#8a4a45" stroke-width="2"/>
  <!-- testes -->
  <ellipse cx="120" cy="240" rx="28" ry="36" fill="#e8d4a8" stroke="#8a4a45" stroke-width="2"/>
  <ellipse cx="280" cy="240" rx="28" ry="36" fill="#e8d4a8" stroke="#8a4a45" stroke-width="2"/>
  <!-- numbered markers -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#1a1a1a">
    <circle cx="55" cy="240" r="12" fill="#fff" stroke="#1a1a1a" stroke-width="1.5"/>
    <text x="55" y="245" text-anchor="middle">1</text>
    <circle cx="55" cy="170" r="12" fill="#fff" stroke="#1a1a1a" stroke-width="1.5"/>
    <text x="55" y="175" text-anchor="middle">2</text>
    <circle cx="200" cy="40" r="12" fill="#fff" stroke="#1a1a1a" stroke-width="1.5"/>
    <text x="200" y="45" text-anchor="middle">3</text>
    <circle cx="345" cy="200" r="12" fill="#fff" stroke="#1a1a1a" stroke-width="1.5"/>
    <text x="345" y="205" text-anchor="middle">4</text>
  </g>
  <line x1="67" y1="240" x2="95" y2="240" stroke="#555" stroke-width="1"/>
  <line x1="67" y1="170" x2="145" y2="155" stroke="#555" stroke-width="1"/>
  <line x1="200" y1="52" x2="200" y2="110" stroke="#555" stroke-width="1"/>
  <line x1="333" y1="200" x2="210" y2="200" stroke="#555" stroke-width="1"/>
