<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 220" role="img" aria-label="Schema Fleischfresser-Gebiss unbeschriftet">
  <!-- Original educational schematic Mathsachs / TaskTrophy (CC0). -->
  <rect width="420" height="220" fill="#faf8f5"/>
  <text x="210" y="28" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#444">Fleischfresser-Gebiss (Schema)</text>
  <!-- upper jaw arc -->
  <path d="M40 90 Q210 40 380 90" fill="none" stroke="#8a4a45" stroke-width="3"/>
  <path d="M40 150 Q210 200 380 150" fill="none" stroke="#8a4a45" stroke-width="3"/>
  <!-- teeth: small incisors, big canines, carnassials -->
  <rect x="150" y="70" width="10" height="28" rx="2" fill="#f5f0e6" stroke="#5a4030"/>
  <rect x="170" y="68" width="10" height="30" rx="2" fill="#f5f0e6" stroke="#5a4030"/>
  <rect x="190" y="68" width="10" height="30" rx="2" fill="#f5f0e6" stroke="#5a4030"/>
  <rect x="210" y="68" width="10" height="30" rx="2" fill="#f5f0e6" stroke="#5a4030"/>
  <!-- canines -->
  <path d="M120 75 L128 120 L136 75 Z" fill="#f5f0e6" stroke="#5a4030" stroke-width="1.5"/>
  <path d="M284 75 L292 120 L300 75 Z" fill="#f5f0e6" stroke="#5a4030" stroke-width="1.5"/>
  <!-- carnassials / cheek -->
  <rect x="80" y="78" width="22" height="26" rx="3" fill="#f5f0e6" stroke="#5a4030"/>
  <rect x="55" y="82" width="20" height="24" rx="3" fill="#f5f0e6" stroke="#5a4030"/>
  <rect x="318" y="78" width="22" height="26" rx="3" fill="#f5f0e6" stroke="#5a4030"/>
  <rect x="345" y="82" width="20" height="24" rx="3" fill="#f5f0e6" stroke="#5a4030"/>
  <!-- lower mirrors simplified -->
  <path d="M120 145 L128 105 L136 145 Z" fill="#f5f0e6" stroke="#5a4030" stroke-width="1.5"/>
  <path d="M284 145 L292 105 L300 145 Z" fill="#f5f0e6" stroke="#5a4030" stroke-width="1.5"/>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1a1a1a">
    <circle cx="200" cy="48" r="11" fill="#fff" stroke="#1a1a1a"/><text x="200" y="52" text-anchor="middle">1</text>
    <circle cx="100" cy="48" r="11" fill="#fff" stroke="#1a1a1a"/><text x="100" y="52" text-anchor="middle">2</text>
    <circle cx="50" cy="110" r="11" fill="#fff" stroke="#1a1a1a"/><text x="50" y="114" text-anchor="middle">3</text>
  </g>
  <line x1="200" y1="59" x2="200" y2="68" stroke="#555"/>
  <line x1="100" y1="59" x2="128" y2="75" stroke="#555"/>
  <line x1="61" y1="110" x2="80" y2="95" stroke="#555"/>
</svg>
