<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 220" role="img" aria-label="Schema Pflanzenfresser-Gebiss unbeschriftet">
  <!-- Original educational schematic Mathsachs / TaskTrophy (CC0). -->
  <rect width="420" height="220" fill="#faf8f5"/>
  <text x="210" y="28" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#444">Pflanzenfresser-Gebiss (Schema)</text>
  <path d="M40 95 Q210 50 380 95" fill="none" stroke="#8a4a45" stroke-width="3"/>
  <path d="M40 145 Q210 190 380 145" fill="none" stroke="#8a4a45" stroke-width="3"/>
  <!-- broad grinding molars -->
  <rect x="60" y="80" width="36" height="28" rx="4" fill="#f5f0e6" stroke="#5a4030"/>
  <rect x="105" y="78" width="36" height="30" rx="4" fill="#f5f0e6" stroke="#5a4030"/>
  <rect x="279" y="78" width="36" height="30" rx="4" fill="#f5f0e6" stroke="#5a4030"/>
  <rect x="324" y="80" width="36" height="28" rx="4" fill="#f5f0e6" stroke="#5a4030"/>
  <!-- diastema gap -->
  <text x="210" y="100" text-anchor="middle" font-size="11" fill="#888" font-family="Segoe UI, Arial, sans-serif">Lücke</text>
  <!-- flat incisors front -->
  <rect x="175" y="72" width="14" height="26" rx="2" fill="#f5f0e6" stroke="#5a4030"/>
  <rect x="195" y="70" width="14" height="28" rx="2" fill="#f5f0e6" stroke="#5a4030"/>
  <rect x="215" y="72" width="14" height="26" rx="2" fill="#f5f0e6" stroke="#5a4030"/>
  <rect x="175" y="122" width="14" height="26" rx="2" fill="#f5f0e6" stroke="#5a4030"/>
  <rect x="195" y="120" width="14" height="28" rx="2" fill="#f5f0e6" stroke="#5a4030"/>
  <rect x="215" y="122" width="14" height="26" rx="2" fill="#f5f0e6" stroke="#5a4030"/>
  <rect x="60" y="118" width="36" height="28" rx="4" fill="#f5f0e6" stroke="#5a4030"/>
  <rect x="324" y="118" width="36" height="28" rx="4" fill="#f5f0e6" stroke="#5a4030"/>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1a1a1a">
    <circle cx="200" cy="48" r="11" fill="#fff" stroke="#1a1a1a"/><text x="200" y="52" text-anchor="middle">1</text>
    <circle cx="80" cy="48" r="11" fill="#fff" stroke="#1a1a1a"/><text x="80" y="52" text-anchor="middle">2</text>
    <circle cx="210" cy="175" r="11" fill="#fff" stroke="#1a1a1a"/><text x="210" y="179" text-anchor="middle">3</text>
  </g>
  <line x1="200" y1="59" x2="200" y2="70" stroke="#555"/>
  <line x1="80" y1="59" x2="90" y2="80" stroke="#555"/>
  <line x1="210" y1="164" x2="210" y2="115" stroke="#555"/>
</svg>
