<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="TaskTrophy">
  <rect width="512" height="512" rx="96" fill="#05122b"/>
  <defs>
    <linearGradient id="trophyGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5d056"/>
      <stop offset="0.55" stop-color="#eeb628"/>
      <stop offset="1" stop-color="#c99212"/>
    </linearGradient>
  </defs>
  <!-- Trophy cup shaped as a capital T: rim = crossbar, stem = upright -->
  <g fill="url(#trophyGold)">
    <!-- Cup bowl -->
    <path d="M156 118h200c0 78-44 128-100 128S156 196 156 118z"/>
    <!-- Rim / T crossbar -->
    <rect x="128" y="98" width="256" height="28" rx="10"/>
    <!-- Left handle -->
    <path d="M156 126c-46 8-70 42-70 84 0 8 6 14 14 14s14-6 14-14c0-28 14-50 42-58V126z"/>
    <!-- Right handle -->
    <path d="M356 126c46 8 70 42 70 84 0 8-6 14-14 14s-14-6-14-14c0-28-14-50-42-58V126z"/>
    <!-- Stem (T upright) -->
    <rect x="232" y="246" width="48" height="118" rx="10"/>
    <!-- Pedestal -->
    <rect x="188" y="360" width="136" height="26" rx="10"/>
    <rect x="168" y="388" width="176" height="30" rx="12"/>
  </g>
</svg>
