name: Deploy GitHub Pages

# Builds the Vite web app and publishes dist/ to the gh-pages branch.
# Site: https://matthiasulrich1.github.io/Mathsachs/
#
# Repo Settings → Pages → Source must be: Deploy from a branch → gh-pages / (root)
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Publish dist to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
          # Keep custom domain across orphan deploys (also mirrored by public/CNAME).
          cname: app.tasktrophy.de
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
