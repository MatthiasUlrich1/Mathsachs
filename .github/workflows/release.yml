name: Build desktop installers

# Builds native installers for Windows, macOS, and Linux.
# - On a version tag (v*), the installers are attached to a GitHub Release.
# - Can also be run manually from the Actions tab (workflow_dispatch).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build installer (${{ matrix.platform }})
        run: npm run electron:dist:${{ matrix.platform }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # GitHub rewrites spaces in asset names to dots; electron-updater
      # writes hyphens into latest.yml. Refuse spaced filenames so the
      # uploaded name matches the updater metadata exactly.
      - name: Reject installer names with spaces
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d release ]; then
            echo "release/ directory missing"
            exit 1
          fi
          spaced="$(find release -maxdepth 1 -name '* *' -print)"
          if [ -n "$spaced" ]; then
            echo "Installer filenames must not contain spaces:"
            echo "$spaced"
            exit 1
          fi

      - name: Upload installers as build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mathsachs-${{ matrix.platform }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
            release/*.yml
            release/*.blockmap
          if-no-files-found: ignore

  # Single release job — concurrent softprops uploads from the matrix race and
  # leave a stuck draft with only partial assets (seen on v0.27.21–v0.27.23).
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List release assets
        run: find release-assets -type f | sort

      - name: Attach installers to the release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          files: release-assets/**
          fail_on_unmatched_files: true
