appId: com.mathsachs.app
productName: TaskTrophy
copyright: Copyright © 2026 Linus und Matthias Ulrich

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - electron/**/*
  - build/icon.png
  - package.json

# Public GitHub Releases (no token in the repo). electron-updater reads this
# as app-update.yml inside packaged builds.
publish:
  - provider: github
    owner: MatthiasUlrich1
    repo: Mathsachs

# Artifact names must contain no spaces. The default NSIS name is
# "${productName} Setup ${version}.${ext}" (spaces). electron-updater then
# writes hyphenated names into latest.yml, while GitHub / action-gh-release
# turn spaces into dots — so Windows auto-update 404s (v0.1.5).
# Keep these aligned with latest.yml / latest-mac.yml / latest-linux.yml.
win:
  target:
    - nsis
  icon: build/icon.png
nsis:
  artifactName: TaskTrophy-Setup-${version}.${ext}
  shortcutName: TaskTrophy
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

# macOS: .dmg disk image.
mac:
  target:
    - dmg
  category: public.app-category.education
  icon: build/icon.png
dmg:
  artifactName: TaskTrophy-${version}-${arch}.${ext}

# Linux: portable AppImage plus a Debian package.
# Do not set a platform-wide linux.artifactName — that would rename the
# Debian package; pin deb.artifactName explicitly instead.
linux:
  target:
    - AppImage
    - deb
  category: Education
  icon: build/icon.png
  executableName: TaskTrophy
  maintainer: TaskTrophy
  synopsis: Das Klassen-Duell — Übungsprogramm
  description: TaskTrophy — Das Klassen-Duell. Lehrplanorientiertes Übungsprogramm.
  desktop:
    entry:
      Name: TaskTrophy
      Comment: Das Klassen-Duell — Übungsprogramm
appImage:
  artifactName: TaskTrophy-${version}.${ext}
deb:
  packageName: tasktrophy
  artifactName: tasktrophy_${version}_${arch}.${ext}
