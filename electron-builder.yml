appId: com.mathsachs.app
productName: Mathsachs
copyright: Copyright © 2026 Linus und Matthias Ulrich

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - electron/**/*
  - build/icon.png
  - package.json

# Public GitHub Releases (no token in the repo). electron-updater reads this
# as app-update.yml inside packaged builds.
publish:
  - provider: github
    owner: MatthiasUlrich1
    repo: Mathsachs

# Artifact names must contain no spaces. The default NSIS name is
# "${productName} Setup ${version}.${ext}" (spaces). electron-updater then
# writes hyphenated names into latest.yml, while GitHub / action-gh-release
# turn spaces into dots — so Windows auto-update 404s (v0.1.5).
# Keep these aligned with latest.yml / latest-mac.yml / latest-linux.yml.
win:
  target:
    - nsis
  icon: build/icon.png
nsis:
  artifactName: Mathsachs-Setup-${version}.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

# macOS: .dmg disk image.
mac:
  target:
    - dmg
  category: public.app-category.education
  icon: build/icon.png
dmg:
  artifactName: Mathsachs-${version}-${arch}.${ext}

# Linux: portable AppImage plus a Debian package.
# Do not set a platform-wide linux.artifactName — that would rename the
# Debian package away from mathsachs_${version}_${arch}.deb.
linux:
  target:
    - AppImage
    - deb
  category: Education
  icon: build/icon.png
  maintainer: Mathsachs
  synopsis: Fast mental-math practice
  description: Mathsachs is a fast, modern mental-math practice desktop app.
  desktop:
    entry:
      Name: Mathsachs
      Comment: Fast mental-math practice
appImage:
  artifactName: Mathsachs-${version}.${ext}
